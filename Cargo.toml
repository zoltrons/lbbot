[package]
name = "lbbot"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[dependencies]
anyhow = "1.0.105"
base64 = "0.23.1"
blake3 = "1.8.7"
chacha20poly1305 = "0.11.0"
jiff = { version = "1", default-features = false, features = ["std", "tzdb-bundle-always"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
resvg = { version = "0.50", default-features = false, features = ["system-fonts", "text"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "macros"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
twilight-gateway = "0.18.0"
twilight-http = "0.18.0"
twilight-model = "0.18.0"
twilight-util = { version = "0.18.0", features = ["builder"] }
zip = "9.8.2"
zstd = "0.14.5"
