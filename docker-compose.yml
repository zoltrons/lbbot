# VPS deploy: `docker compose up -d`. Values come from .env (see .env.example).
# Uses the image published by GitHub Actions; `docker compose up -d --build` builds it locally instead.
services:
  bot:
    image: ghcr.io/zoltrons/lbbot:latest
    build: .
    restart: unless-stopped
    # The bot only needs to write export downloads to /tmp.
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - exports:/tmp
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      TOKEN_KEY: ${TOKEN_KEY}
      LB_TOKEN: ${LB_TOKEN}
      DATABASE_URL: postgres://lbbot:${POSTGRES_PASSWORD}@db/lbbot
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lbbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: lbbot
    # Small VPS: writes are batched and few connections are needed.
    command: postgres -c shared_buffers=128MB -c max_connections=20 -c wal_compression=on
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "lbbot"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
  exports:
